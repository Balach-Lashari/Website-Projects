<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urdu Sikho - Learn Urdu Flashcards</title>
  <meta name="description" content="A playful flashcard app for English speakers learning beginner Urdu vocabulary." />

  <!-- Google Fonts: Noto Nastaliq Urdu for Urdu script, Baloo 2 for playful UI text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1><span aria-hidden="true">🌸</span> Urdu Sikho</h1>
    <p class="tagline">Learn Urdu, one card at a time</p>
  </header>

  <main id="app">
    <!-- HOME VIEW: category picker -->
    <section id="home-view" class="view">
      <div class="overall-progress">
        <p id="overall-progress-text">0 / 0 words learned</p>
        <div class="progress-bar-track">
          <div id="overall-progress-bar" class="progress-bar-fill"></div>
        </div>
      </div>

      <div id="category-grid" class="category-grid"></div>
    </section>

    <!-- FLASHCARD VIEW: one category's deck -->
    <section id="flashcard-view" class="view">
      <button id="back-btn" class="btn btn-ghost">← Categories</button>

      <div class="category-header">
        <h2 id="category-title"></h2>
        <p id="category-progress-text"></p>
        <div class="progress-bar-track">
          <div id="category-progress-bar" class="progress-bar-fill"></div>
        </div>
      </div>

      <div class="card-stage">
        <button id="prev-btn" class="nav-arrow" aria-label="Previous card">‹</button>

        <div id="flashcard" class="flashcard" tabindex="0" role="button" aria-pressed="false" aria-label="Flashcard. Press Enter or click to reveal the meaning.">
          <span id="card-status-badge" class="status-badge"></span>

          <div class="flashcard-inner">
            <div class="flashcard-face flashcard-front">
              <p id="card-urdu" class="card-urdu" lang="ur" dir="rtl"></p>
              <p class="flip-hint">👆 Tap to reveal meaning</p>
            </div>
            <div class="flashcard-face flashcard-back">
              <p id="card-translit" class="card-translit"></p>
              <p id="card-english" class="card-english"></p>
              <p class="flip-hint">👆 Tap to see Urdu again</p>
            </div>
          </div>
        </div>

        <button id="next-btn" class="nav-arrow" aria-label="Next card">›</button>
      </div>

      <button id="flip-btn" class="btn btn-flip">🔄 Flip Card</button>

      <p id="card-counter" class="card-counter"></p>

      <div class="action-buttons">
        <button id="shuffle-btn" class="btn btn-secondary">🔀 Shuffle</button>
        <button id="learning-btn" class="btn btn-learning">📖 Still Learning</button>
        <button id="known-btn" class="btn btn-known">✅ Known</button>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Made with 💛 for Urdu learners</p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
